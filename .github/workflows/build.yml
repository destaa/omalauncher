name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          # What upstream's ci.yml and release.yml use; the app's owl module pins a 17 toolchain.
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install bsdtar & fetch proot
        run: |
          # bsdtar unpacks Termux's packages, whose .deb are ar archives, and patch applies proot's
          # patches/. Ubuntu's mirrors have been unreachable from runners ("Temporary failure resolving
          # 'archive.ubuntu.com'"), which failed the build before it compiled anything, so a failure here
          # falls back to a Python stand-in (scripts/bsdtar-fallback.py) that reads the same ar and zip
          # archives, and to git's own apply for the patches.
          if ! { sudo apt-get update -q && sudo apt-get install -yq libarchive-tools patch; }; then
            echo "::warning::libarchive-tools and patch could not be installed; falling back to Python and git apply"
            mkdir -p "$RUNNER_TEMP/bin"
            printf '#!/bin/sh\nexec python3 %s "$@"\n' "$GITHUB_WORKSPACE/scripts/bsdtar-fallback.py" > "$RUNNER_TEMP/bin/bsdtar"
            chmod +x "$RUNNER_TEMP/bin/bsdtar"
            # patch -d DIR -p1 --quiet < p, as fetch-proot.sh runs it, through git apply in that directory.
            printf '#!/bin/sh\nwhile [ $# -gt 0 ]; do case "$1" in -d) cd "$2" || exit 1; shift 2;; -p) shift 2;; --quiet) shift;; *) break;; esac; done\nexec git apply -p1 -\n' > "$RUNNER_TEMP/bin/patch"
            chmod +x "$RUNNER_TEMP/bin/patch"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
            # Also for the rest of this step: GITHUB_PATH only reaches the ones after it.
            export PATH="$RUNNER_TEMP/bin:$PATH"
          fi
          # The NDK the script builds proot with, as upstream's release.yml installs it.
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          echo "NDK=$ndk ANDROID_HOME=$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/ndk/$ndk" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" || {
              echo "sdkmanager failed; installed NDKs:" >&2
              ls "$ANDROID_HOME/ndk" 2>&1 >&2
              exit 1
            }
          fi
          # Its output, so a failure shows in the annotations rather than only in the job log.
          scripts/fetch-proot.sh 2>&1 | tee "$RUNNER_TEMP/proot.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 25 "$RUNNER_TEMP/proot.log" | while IFS= read -r line; do echo "::error title=fetch-proot.sh::$line"; done
            exit "$status"
          fi
      - name: Grant execute permission
        run: chmod +x gradlew
      # Signed with the phone's own key (repo secrets: KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS,
      # KEY_PASSWORD), so a new APK installs over the old one: an uninstall takes the Linux system,
      # the coding agents, their sessions, the widgets and the style with it.
      - name: Sign with the permanent keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::KEYSTORE_B64 is not set: this APK is signed with a throwaway debug key and cannot update the installed app"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/omalauncher.p12"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreType=PKCS12\n' \
            "$RUNNER_TEMP/omalauncher.p12" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Build with Gradle
        run: ./gradlew assembleDebug
      - name: Fingerprint the APK's signer
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          signer=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | tail -1)
          [ -z "$signer" ] || "$signer" verify --print-certs "$apk" | grep -i "SHA-256" || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omalauncher-mod
          path: app/build/outputs/apk/debug/*.apk